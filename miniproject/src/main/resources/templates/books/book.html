<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서 수정</title>
    <style>
        :root {
            --green-50: #f0fdf4;
            --green-100: #dcfce7;
            --green-200: #bbf7d0;
            --green-300: #86efac;
            --green-400: #4ade80;
            --green-500: #22c55e;
            --green-600: #16a34a;
            --green-700: #15803d;
            --teal-200: #99f6e4;
            --stone-700: #334155;
            --white: #ffffff;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
            color: var(--stone-700);
            background:
                    radial-gradient(1200px 600px at 10% 0%, rgba(34,197,94,0.12), transparent 60%),
                    radial-gradient(800px 500px at 100% 20%, rgba(16,163,74,0.12), transparent 55%),
                    linear-gradient(180deg, var(--green-50), var(--green-100));
            display: grid;
            place-items: start center;
            padding: 48px 16px 64px;
            position: relative;
            overflow-x: hidden;
        }

        /* 잎사귀 데코 (CSS만으로 추가, DOM 변경 없음) */
        body::before, body::after {
            content: "";
            position: absolute;
            pointer-events: none;
            opacity: 0.2;
            filter: blur(0.2px);
            background-repeat: no-repeat;
            background-size: contain;
        }

        /* 좌상단 크고 흐린 잎 */
        body::before {
            top: -40px;
            left: -60px;
            width: 220px;
            height: 220px;
            transform: rotate(-12deg);
            background-image: url('data:image/svg+xml;utf8,\
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">\
          <defs>\
            <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">\
              <stop offset="0%" stop-color="%2322c55e"/>\
              <stop offset="100%" stop-color="%234ade80"/>\
            </linearGradient>\
          </defs>\
          <path d="M100 10 C40 40, 10 90, 24 130 C40 175, 90 190, 140 170 C185 150, 190 100, 160 60 C140 35, 120 20, 100 10 Z" fill="url(%23g)"/>\
        </svg>');
        }

        /* 우하단 작은 잎 */
        body::after {
            right: -30px;
            bottom: -30px;
            width: 160px;
            height: 160px;
            transform: rotate(8deg);
            background-image: url('data:image/svg+xml;utf8,\
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">\
          <defs>\
            <linearGradient id="g2" x1="0" x2="1" y1="0" y2="1">\
              <stop offset="0%" stop-color="%2399f6e4"/>\
              <stop offset="100%" stop-color="%2386efac"/>\
            </linearGradient>\
          </defs>\
          <path d="M110 20 C60 40, 30 90, 38 125 C50 165, 90 178, 130 165 C165 153, 172 112, 154 76 C139 46, 126 28, 110 20 Z" fill="url(%23g2)"/>\
        </svg>');
        }

        /* 카드 래퍼 - 기존 구조 유지, 요소 선택자만 사용 */
        form {
            width: 100%;
            max-width: 560px;
            background: linear-gradient(180deg, var(--white), rgba(255,255,255,0.96));
            border: 1px solid rgba(34,197,94,0.16);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(16,185,129,0.12), 0 2px 6px rgba(16,185,129,0.08);
            padding: 28px 24px 20px;
            backdrop-filter: blur(6px);
        }

        h1 {
            margin: 0 0 18px 0;
            font-size: 28px;
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, var(--green-700), var(--green-500));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 1px 0 rgba(255,255,255,0.6);
        }

        p {
            margin: 14px 0 0;
            display: grid;
            grid-template-columns: 76px 1fr;
            align-items: center;
            gap: 10px;
        }

        p:first-of-type { margin-top: 4px; }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1.5px solid var(--green-200);
            border-radius: 12px;
            background: #fbfffd;
            outline: none;
            transition: box-shadow 180ms ease, border-color 180ms ease, transform 120ms ease;
            font-size: 15px;
        }

        input[type="text"]:focus {
            border-color: var(--green-400);
            box-shadow: 0 0 0 6px rgba(34,197,94,0.15), 0 6px 20px rgba(34,197,94,0.12);
            transform: translateY(-1px);
        }

        button[type="submit"] {
            margin-top: 18px;
            width: 100%;
            padding: 13px 16px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            background: linear-gradient(180deg, var(--green-500), var(--green-600));
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(16,185,129,0.28);
            transition: transform 120ms ease, box-shadow 180ms ease, filter 180ms ease;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(22,163,74,0.32);
            filter: saturate(1.1);
        }

        button[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 6px 16px rgba(22,163,74,0.28);
        }

        hr {
            width: 100%;
            max-width: 560px;
            margin: 18px auto;
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(34,197,94,0.25), transparent);
        }

        a[href] {
            display: inline-block;
            text-decoration: none;
            font-weight: 700;
            padding: 10px 14px;
            border-radius: 12px;
            color: var(--green-700);
            background: rgba(34,197,94,0.10);
            border: 1px solid rgba(34,197,94,0.22);
            transition: background 180ms ease, transform 120ms ease, box-shadow 180ms ease;
        }

        a[href]:hover {
            background: rgba(34,197,94,0.16);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(34,197,94,0.18);
        }

        /* 반응형 */
        @media (max-width: 560px) {
            p { grid-template-columns: 1fr; gap: 6px; }
            p > input[type="text"] { margin-top: -2px; }
            form { padding: 22px 18px 16px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
<h1>도서 상세 및 수정</h1>
<form th:action="@{/books/{id}/update(id=${book.id})}" th:object="${book}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>제목:</label>
    <input type="text" th:field="*{title}" />
    <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:red"></div>

    <label>저자:</label>
    <input type="text" th:field="*{author}" />
    <div th:if="${#fields.hasErrors('author')}" th:errors="*{author}" style="color:red"></div>

    <button type="submit">수정</button>
</form>
<hr>
<a th:href="@{/books}">목록으로</a>
</body>
</html>
