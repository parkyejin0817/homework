<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>도서 등록하기</title>
  <style>
    :root {
      --green-50: #f0fdf4;
      --green-100: #dcfce7;
      --green-200: #bbf7d0;
      --green-300: #86efac;
      --green-400: #4ade80;
      --green-500: #22c55e;
      --green-600: #16a34a;
      --green-700: #15803d;
      --white: #ffffff;
      --stone-700: #334155;
    }

    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(180deg, var(--green-50), var(--green-100));
      color: var(--stone-700);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 60px 16px;
      min-height: 100vh;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 24px;
      background: linear-gradient(90deg, var(--green-700), var(--green-500));
      -webkit-background-clip: text;
      color: transparent;
      font-weight: 800;
    }

    form {
      background: linear-gradient(180deg, var(--white), rgba(255,255,255,0.96));
      padding: 30px 26px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(34,197,94,0.15);
      border: 1px solid rgba(34,197,94,0.2);
      max-width: 460px;
      width: 100%;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--green-200);
      margin-top: 6px;
      background: #fbfffd;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--green-400);
      box-shadow: 0 0 0 6px rgba(34,197,94,0.12);
    }

    button[type="submit"] {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(180deg, var(--green-500), var(--green-600));
      color: white;
      font-weight: 700;
      font-size: 16px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(16,185,129,0.28);
      transition: all 0.2s ease;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(22,163,74,0.32);
    }

    a[href] {
      display: inline-block;
      margin-top: 22px;
      text-decoration: none;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 12px;
      color: var(--green-700);
      background: rgba(34,197,94,0.10);
      border: 1px solid rgba(34,197,94,0.22);
      transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    a[href]:hover {
      background: rgba(34,197,94,0.16);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(34,197,94,0.18);
    }
  </style>
</head>
<body>
<h1>도서 등록 페이지</h1>
<form th:action="@{/books/add}" th:object="${book}" method="post">
  <label>제목:</label>
  <input type="text" th:field="*{title}" />
  <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:red"></div>

  <label>저자:</label>
  <input type="text" th:field="*{author}" />
  <div th:if="${#fields.hasErrors('author')}" th:errors="*{author}" style="color:red"></div>

  <button type="submit">등록</button>
</form>

<a th:href="@{/books}">목록</a>
</body>
</html>
